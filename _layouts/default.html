{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    
    <style>
      /* Global Footer Styling (Dark Charcoal with light grey text and matching light grey links) */
      .page__footer {

      }
      .page__footer a {
        color: #e0e0e0 !important;
      }

        color: #1a237e !important;

        border-bottom: 2px solid #d84315 !important;
